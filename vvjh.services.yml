services:
  Drupal\vvjh\Hook\VvjhHelpHook:
    autowire: true

  Drupal\vvjh\Hook\VvjhThemeHook:
    autowire: true

  Drupal\vvjh\Hook\VvjhPreprocessHooks:
    autowire: true

  # `@?` makes the dependency nullable so the container compiles even
  # when vvj_core hasn't been enabled yet (the v1 → v2 upgrade window
  # before vvjh_update_10001 runs).
  Drupal\vvjh\Hook\VvjhTokenHooks:
    arguments:
      - '@?vvj_core.token_resolver'
